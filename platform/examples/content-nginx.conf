# A separate static-only content origin. No auth/API proxy belongs here.
server {
    listen 443 ssl;
    server_name game-content.example.net;
    ssl_certificate /etc/letsencrypt/live/game-content.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game-content.example.net/privkey.pem;
    root /srv/arcane-game-content;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri =404;
    }
}
