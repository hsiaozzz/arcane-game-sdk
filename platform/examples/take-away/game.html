<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星石争夺</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui;background:#071019;color:#e7effa}body{display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(720px,100%);padding:clamp(20px,5vw,42px);border:1px solid #26475d;border-radius:28px;background:radial-gradient(ellipse at top,#17384f,#0a1623 70%);box-shadow:0 24px 90px #0007}.eyebrow{font-size:11px;letter-spacing:3px;color:#67e8f9}h1{font-size:clamp(30px,6vw,48px);margin:12px 0}p{color:#adc1d2;line-height:1.7}#stones{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin:32px 0;min-height:140px}.stone{min-width:0;aspect-ratio:1;border-radius:24% 46%;background:linear-gradient(145deg,#a5f3fc,#0891b2 70%);box-shadow:0 0 18px #22d3ee55;transition:opacity .2s,transform .2s}.gone{opacity:.1;transform:scale(.65)}.actions{display:flex;flex-wrap:wrap;gap:12px}button{padding:13px 24px;border:1px solid #38bdf8;border-radius:12px;background:#075985;color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.35;cursor:default}#notice{min-height:30px;color:#67e8f9}#error{color:#fda4af}#stats{font-size:13px;color:#a8bdcf}#name{padding:10px;border:1px solid #355b72;border-radius:9px;background:#081c2b;color:white;max-width:180px}.profile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#board{white-space:pre-line;font-size:13px;color:#c4d8e6}</style>
<script>if(parent!==self){const q=new URLSearchParams(location.search),o=q.get('arcaneHostOrigin'),c=q.get('arcaneChannel');try{if(new URL(o).origin===o&&/^https?:/.test(o)&&/^[a-f0-9]{48}$/.test(c))window.__ARCANE_GAME__={protocol:'arcane-game-sdk',version:1,hostOrigin:o,channelId:c}}catch{}}</script>
</head><body><main class="card"><span class="eyebrow">ARCANE · AUTHORITATIVE MULTIPLAYER</span><h1>星石争夺</h1><p>21 颗星石，两人轮流取走 1—3 颗。拿到最后一颗的人获胜。<br>邀请朋友打开同一页面，或用两个独立浏览器身份进行匹配。</p><div class="profile"><input id="name" aria-label="游戏昵称" maxlength="24" placeholder="你的昵称"><button id="save-name">保存昵称</button></div><div id="stones"></div><div id="notice" role="status">正在连接平台…</div><div class="actions"><button id="join" disabled>寻找对手</button><button id="cancel" hidden>取消匹配</button><button class="take" data-take="1" disabled>取 1 颗</button><button class="take" data-take="2" disabled>取 2 颗</button><button class="take" data-take="3" disabled>取 3 颗</button></div><p id="error" role="alert"></p><p id="stats"></p><div id="board"></div></main>
<script type="module">
import { ArcaneGame, createMatchConnection } from '/sdk/index.js';
const $=q=>document.querySelector(q), wait=ms=>new Promise(r=>setTimeout(r,ms));
let sdk,context,profile,connection,queue,running=false,cancelled=false,refreshVersion=0;
const notice=message=>$('#notice').textContent=message;
const fail=error=>$('#error').textContent=error.message;
function paint(state){$('#stones').replaceChildren(...Array.from({length:21},(_,i)=>{const el=document.createElement('div');el.className='stone'+(i>=state.stones?' gone':'');return el}));const own=state.turn===context.gameUserId;document.querySelectorAll('.take').forEach(b=>b.disabled=state.status!=='playing'||!own||+b.dataset.take>state.stones);if(state.status==='playing')notice(`${own?'轮到你了':'对手正在思考'} · 剩余 ${state.stones} 颗`);if(state.status==='waiting')notice('已匹配 · 正在等待另一位选手入场…');if(state.status==='finished'){notice(state.reason==='join_timeout'?'对手没能及时入场，本局取消，不计成绩。':state.winner===context.gameUserId?'你抓住了最后一颗星！':'这次让对手摘星了，下局再来。');$('#join').disabled=false;running=false;void refresh().catch(fail);}}
async function refresh(){const version=++refreshVersion,board=await sdk.leaderboards.list({leaderboardId:'points'});if(version!==refreshVersion)return;$('#board').textContent=board.records.map(p=>`#${p.rank}  ${p.displayName} · ${p.score} 分`).join('\n');$('#stats').textContent=board.ownRecord?`我的排名 #${board.ownRecord.rank} · ${board.ownRecord.score} 分`:'完成比赛后，你的排名会出现在这里。';}
async function recoverFinal(matchRunId){if(!matchRunId)return false;const match=await sdk.match.get({matchRunId});if(match.state?.status==='finished'){paint(match.state);$('#error').textContent='';return true}return false;}
try{sdk=await ArcaneGame.connect();context=await sdk.context.get();profile=await sdk.profile.get();$('#name').value=profile.displayName;$('#join').disabled=false;notice('已连接 · 等待你开启一场星石对决');await refresh();const previous=await sdk.matchmaking.status();if(previous.queue?.matchRunId)await recoverFinal(previous.queue.matchRunId);}catch(e){fail(e);notice('请从平台游戏入口打开此页面。')}
$('#save-name').onclick=async()=>{try{profile=await sdk.profile.update({displayName:$('#name').value,expectedVersion:profile.version});notice('昵称已保存')}catch(e){fail(e)}};
$('#join').onclick=async()=>{if(running)return;running=true;cancelled=false;$('#join').disabled=true;$('#cancel').hidden=false;$('#error').textContent='';connection?.close();try{queue=(await sdk.matchmaking.join({mode:'default'})).queue;while(queue.status==='waiting'&&!cancelled){notice('正在寻找对手…');await wait(800);if(cancelled)break;queue=(await sdk.matchmaking.status({queueId:queue.queueId})).queue;if(!queue)throw new Error('匹配已取消，请重新开始。')}if(cancelled)return;$('#cancel').hidden=true;if(await recoverFinal(queue.matchRunId))return;const ticket=await sdk.match.ticket({matchRunId:queue.matchRunId});connection=createMatchConnection(ticket,{maxReconnectAttempts:3,refreshTicket:()=>sdk.match.ticket({matchRunId:queue.matchRunId})});connection.onState(({state})=>paint(state));connection.on('error',e=>{fail(e);void recoverFinal(queue?.matchRunId).catch(()=>{})});await connection.ready;}catch(e){fail(e);await recoverFinal(queue?.matchRunId).catch(()=>{});running=false;$('#join').disabled=false;$('#cancel').hidden=true;}};
$('#cancel').onclick=async()=>{cancelled=true;try{await sdk.matchmaking.cancel({queueId:queue?.queueId});notice('匹配已取消')}catch(e){fail(e)}running=false;$('#join').disabled=false;$('#cancel').hidden=true;};
document.querySelectorAll('.take').forEach(b=>b.onclick=()=>{try{connection.sendInput({take:+b.dataset.take})}catch(e){fail(e)}});
addEventListener('pagehide',()=>{cancelled=true;connection?.close();sdk?.close()},{once:true});
</script></body></html>
