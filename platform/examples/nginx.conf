# Install on the Docker host; replace domain and certificate paths.
map $http_upgrade $arcane_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name play.example.com;
    ssl_certificate /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
    client_max_body_size 128k;
    location / {
        proxy_pass http://127.0.0.1:7400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arcane_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
